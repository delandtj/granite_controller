[package]
name = "granite-core"
description = "Host-testable core of the Granite controller firmware: HAL traits, node actuator, rule engine, config, message and Modbus models"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
heapless = "0.9.3"
hmac = { version = "0.13.0", default-features = false }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.0", default-features = false }

[features]
default = ["std"]
std = ["serde/std", "serde_json/std"]
