[package]
name = "granite-sim"
description = "Host simulator for the Granite controller: granite-core over fake hardware, the same HTTP setup page and API, plus the fleet recovery and Modbus map host tools"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "original-uri"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
granite-core = { version = "0.1.0", path = "../granite-core" }
p256 = { version = "0.14.0", features = ["ecdsa", "pem", "pkcs8"] }
rand = "0.10.3"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "blocking", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util"] }
toml = "1.1.8"
