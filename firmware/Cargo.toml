# Granite controller firmware workspace.
#
# granite-core is host-testable (no_std + alloc, no ESP-IDF); granite-sim
# runs it against fake hardware on the host (std, axum).
# granite-proto is the plane link wire format (no_std, no alloc, no
# dependencies), shared with the plane firmware.
# plane-logic is the plane firmware core (no_std, no alloc): it builds for
# thumbv6m-none-eabi and, with the sim feature, runs on the host.
# granite-fw is excluded on purpose: it is an ESP-IDF crate with its own
# target, linker and .cargo/config.toml, and must not share this
# workspace's build settings.
[workspace]
members = ["granite-core", "granite-proto", "granite-sim", "plane-logic"]
exclude = ["granite-fw"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
