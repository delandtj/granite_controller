# STM32G070CBT6 (LQFP-48) pin designations of the PP-48 core board, CAN FD link
# (docs/adr/0006-plane-link-can-fd.md). The G0B1CCT6 build uses the same pins (FDCAN1 on PB8 / PB9,
# MCP2518FD U5 not fitted).
# GENERATED by power/pp-48-fd/tools/gensch.py core from tools/sch/blocks/mcu.py
# (CORE_PINS / PIN_USE): do not edit here, change the generator and regenerate.
# The schematic (power/pp-48-core-fd/sheets/mcu.kicad_sch) and the board follow the same table.
# hse_hz: the STM32's own HSE; the MCP2518FD runs on its own 40 MHz crystal Y2.

[mcu]
part = "STM32G070CBT6"
package = "LQFP-48"
hse_hz = 8000000

[[pin]]
port = "NRST"
pin = 10
net = "NRST"
mode = "NRST"
use = "reset, SWD header (fixed)"

[[pin]]
port = "PA0"
pin = 11
net = "MCP_INT"
mode = "input, EXTI falling"
use = "MCP2518FD U5 nINT (100k pull-up R34); G070 build"

[[pin]]
port = "PA4"
pin = 15
net = "MCP_CS"
mode = "output push-pull (SPI1_NSS by software)"
use = "MCP2518FD U5 nCS (100k pull-up R33); G070 build"

[[pin]]
port = "PA5"
pin = 16
net = "SPI_SCK"
mode = "SPI1_SCK AF0"
use = "MCP2518FD U5 SCK (<= 17 MHz at 40 MHz SYSCLK); G070 build"

[[pin]]
port = "PA6"
pin = 17
net = "SPI_MISO"
mode = "SPI1_MISO AF0"
use = "MCP2518FD U5 SDO; G070 build"

[[pin]]
port = "PA7"
pin = 18
net = "SPI_MOSI"
mode = "SPI1_MOSI AF0"
use = "MCP2518FD U5 SDI; G070 build"

[[pin]]
port = "PA8"
pin = 28
net = "ADR2"
mode = "input"
use = "address strap ADR2"

[[pin]]
port = "PA11"
pin = 33
net = "SCL2"
mode = "I2C2_SCL AF6"
use = "I2C master: TCA9548A 0x70, then one unit segment per channel"

[[pin]]
port = "PA12"
pin = 34
net = "SDA2"
mode = "I2C2_SDA AF6"
use = "I2C master: TCA9548A 0x70, then one unit segment per channel"

[[pin]]
port = "PA13"
pin = 35
net = "SWDIO"
mode = "SWDIO"
use = "debug (fixed)"

[[pin]]
port = "PA14"
pin = 36
net = "SWCLK"
mode = "SWCLK"
use = "debug (fixed)"

[[pin]]
port = "PA15"
pin = 37
net = "ADR0"
mode = "input"
use = "address strap ADR0: pulled up, DIP switch SW1 ON = 0; CAN node id = ADR[2:0] (ADR 0006)"

[[pin]]
port = "PB8"
pin = 47
net = "CAN_RX"
mode = "analog (G070) / FDCAN1_RX AF3 (G0B1)"
use = "CAN_RX: ISO1044 U4 RXD (also the MCP2518FD RXCAN); G070 build: unused, leave in reset (analog)"

[[pin]]
port = "PB9"
pin = 48
net = "CAN_TX"
mode = "analog (G070) / FDCAN1_TX AF3 (G0B1)"
use = "CAN_TX: ISO1044 U4 TXD; G070 build: the MCP2518FD TXCAN drives it, PB9 MUST stay in reset (analog, high-Z)"

[[pin]]
port = "PB11"
pin = 23
net = "VIN_SNS"
mode = "ADC_IN15"
use = "core 48 V input, 220k / 10k divider"

[[pin]]
port = "PB12"
pin = 24
net = "PRESS_TRIG"
mode = "output push-pull"
use = "toggle to retrigger the press deadline U301 (~1 s); never toggle when no press runs"

[[pin]]
port = "PB13"
pin = 25
net = "MUX_RST"
mode = "output push-pull"
use = "high = mux reset, all channels off (Q6 inverts; 100k pull-down)"

[[pin]]
port = "PB14"
pin = 26
net = "LED_RUN"
mode = "output push-pull"
use = "heartbeat LED, high = on"

[[pin]]
port = "PD0"
pin = 38
net = "EXP_RSTN"
mode = "output open-drain"
use = "low = reset every unit's TCA6424A (bused, pull-ups on the units)"

[[pin]]
port = "PD1"
pin = 39
net = "ADR1"
mode = "input"
use = "address strap ADR1"

[[pin]]
port = "PF0"
pin = 8
net = "OSC_IN"
mode = "OSC_IN"
use = "8 MHz HSE crystal (fixed)"

[[pin]]
port = "PF1"
pin = 9
net = "OSC_OUT"
mode = "OSC_OUT"
use = "8 MHz HSE crystal (fixed)"

# not connected (pins 29 / 32 are not bonded on the G070; PA9 / PA10 on the G0B1, left open)
[unused]
pins = [1, 2, 3, 12, 13, 14, 19, 20, 21, 22, 27, 29, 30, 31, 32, 40, 41, 42, 43, 44, 45, 46]
