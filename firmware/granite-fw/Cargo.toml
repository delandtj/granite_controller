[package]
name = "granite-fw"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
esp-idf-hal = "0.47.0"
esp-idf-svc = "0.53.0"
esp-idf-sys = "0.38.1"
granite-core = { version = "0.1.0", path = "../granite-core" }
log = "0.4.34"
mcp2518fd = { version = "0.1.0", path = "../mcp2518fd", optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }

[features]
# One link per image (ADR 0006, architecture component 7): exactly one of
# link-canfd / link-i2c must be set, and src/lib.rs refuses the build
# otherwise. Nothing above granite_core::hal::PlaneLink knows which is
# built.
default = ["link-canfd"]
# The FD generation (controller-fd): MCP2518FD on the W5500's SPI bus,
# nCS GPIO2, nINT GPIO3, TCAN1044V STB on GPIO0, the CAN FD transport of
# firmware ADR 0005. The first batch is this one.
link-canfd = ["dep:mcp2518fd"]
# Rev D: the isolated I2C link on GPIO2 / GPIO3 with EXP_INT on GPIO0.
# Still the NAK stub of src/hw/plane_link.rs: the rev D driver is not
# written until a rev D board is ordered (ADR 0006, "First batch").
link-i2c = []
# The rev C bench board: an image for the board the firmware is tried on
# today. Rev C has no MCP2518FD; its GPIO2 / GPIO3 are the internal I2C
# bus (U14, U15 and the TMP1075 U5 at 0x48) and GPIO0 is EXP_INT - the
# same pin map as link-i2c, so it is that build under the board's name.
# The TMP1075 reads off GPIO2 / GPIO3 and the stub plane link confirms
# the image without link-bench. Build with --no-default-features.
rev-c = ["link-i2c"]
# Bench relief for a board with no MCP2518FD on it (the rev C board the
# image is tried on): a link that does not come up is logged instead of
# keeping the image from marking itself valid. A shipped image must never
# have this: the validation gate of ADR 0006 component 7 is what rolls an
# image back that cannot see its link hardware.
link-bench = []
# Devboard bring-up exercise for the hardware layer (src/hw/hwtest.rs,
# examples/hwtest.rs). Off in a shipped image.
hwtest = []
# Wi-Fi STA instead of the W5500, so HTTPS, MQTT, Modbus and OTA can be
# exercised on a bare ESP32-C6 devboard (src/platform/wifi_dev.rs).
# Needs GRANITE_WIFI_SSID and GRANITE_WIFI_PASS at build time and fails
# the build without them. Never in an image for a controller board: ADR
# 0001 keeps the radio dark. Off in a shipped image.
wifi-dev = []
# Mirror the status LED patterns in colour on the addressable WS2812 of
# an ESP32-C6 devkit (src/hw/rgb.rs), on GPIO8 by default and on
# GRANITE_RGB_GPIO when set. The controller board has no RGB LED, so
# this is bench-only. Off in a shipped image.
rgb-led = []
# Stall every relay release for 8 s, as if the actuator task hung, so the
# esp_timer press deadline is what opens the relay (src/hw/relays.rs).
# Bench-only. Off in a shipped image.
deadline-test = []
# Hang at boot while on probation, so only the RTC watchdog can recover
# the board (src/main.rs, platform/ota.rs). Bench-only. Off in a shipped
# image.
boot-hang-test = []
# Hang the dispatcher on a `probe_scan` command, so the task watchdog
# has to reset the board (src/main.rs). Bench-only. Off in a shipped
# image.
dispatcher-hang-test = []
# Everything that only makes sense on a devboard, in one flag. It
# includes link-bench: a devkit has no MCP2518FD, so the link gate would
# roll every image back.
devboard = ["wifi-dev", "rgb-led", "link-bench"]
mcp2518fd = ["dep:mcp2518fd"]

[[example]]
name = "hwtest"
path = "examples/hwtest.rs"
required-features = ["hwtest"]

[build-dependencies]
embuild = "0.33.5"

# DS18B20 probes: the Espressif managed component that does 1-wire over
# RMT (ADR 0001 component 4). esp-idf-hal's `onewire` module appears only
# when this component is in the build.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/onewire_bus", version = "^1.0.2" }

# mDNS: an external ESP-IDF component since v5, needed by
# esp_idf_svc::mdns (ADR 0001 component 6, `_https._tcp` and
# `_granite._tcp`).
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "^1.8.2" }

# Local C helpers that need lwIP's own struct layouts (platform/net.rs:
# stop AutoIP once DHCP holds the netif).
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = "components"

# Size matters: an OTA slot (0x3D0000 = 3,997,696 B) must hold TLS, MQTT,
# HTTP assets and lwIP (ADR 0001 decision 11).
[profile.release]
opt-level = "s"
# -199 KB on 2026-11-04 (1.85 -> 1.65 MB). With the `factory` partition
# dropped the same day the slot grew to 0x3D0000, so 1.65 MB is 41.4 %.
lto = true

[profile.dev]
debug = true
opt-level = "z"
