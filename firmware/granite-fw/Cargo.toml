[package]
name = "granite-fw"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
esp-idf-hal = "0.47.0"
esp-idf-svc = "0.53.0"
esp-idf-sys = "0.38.1"
log = "0.4.34"

[build-dependencies]
embuild = "0.33.5"

# Size matters: two 2.5 MB OTA slots must hold TLS, MQTT, HTTP assets and
# lwIP (ADR 0001, "Two OTA slots of 2.5 MB each").
[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
