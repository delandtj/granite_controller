# pcbkit settings for the PP-48 plane (docs/adr/0004-plane-column-layout.md).
# 4L JLC 1.6 mm: F parts and pours, In1 GND, In2 VBUS + the SDA/SCL channel, B parts and pours.
#
# N = 2: core (48 mm) + 1 unit of 2 slot columns + 8 mm end strip (106 x 72 mm).
# Board flow: gensch.py N -> netlist -> mkboard -> outline -> setrules -> tools/place.py ->
# tools/core.py -> tools/route_hand.py -> tools/netsplit.py split -> pcbkit krt-route (krt-reroute
# on the split board as needed) -> tools/netsplit.py join -> tools/route_hand.py again (KRT
# moves kept copper) -> tools/copycol.py -> tools/gndstitch.py -> pcbkit prune (until no dangling)
# -> pcbkit silk -> kicad-cli pcb drc --refill-zones --save-board --schematic-parity

[project]
name = "pp-48"
libs = { pp48 = "pp48.pretty" }

[mkboard]
copper_layers = 4
stage_x = -120.0
sheet_pitch = 90.0
cell = 14.0
per_row = 6

[outline]
# core (48 mm, tools/core.py) + N/2 x 50 mm units + 8 mm end strip (N = 2/4; ADR 0004 decision 8):
# corner holes at the ends only, 4 mm inset
length = 106.0
height = 72.0
origin = [52.0, 100.0]
hole_refs = ["H1", "H2", "H3", "H4"]

[rules]
stackup = "jlc04161h-7628"
layers = { "In1.Cu" = ["power", "GND"], "In2.Cu" = ["mixed", "VBUS"] }

[rules.netclasses]
# name = [track, clearance, via_dia, via_drill]
Default = [0.2, 0.15, 0.5, 0.2]
GND     = [0.4, 0.2, 0.6, 0.3]

[krt]
work = "~/.cache/pcbkit/pp-48/route"
rework = "~/.cache/pcbkit/pp-48/reroute"
clearance = 0.15
via = [0.5, 0.2]
track_width = 0.2
same_net_pad_clearance = 0.15
signal_layers = ["F.Cu", "B.Cu"]
# tools/route_hand.py copper (power pours, shunt vias, Kelvin, In2 channel, taps, core power path,
# CTRL_GND pours and the isolation band)
keep_groups = ["hand"]
# OUT's 7 A path is the hand pours; the router only adds the sense taps (U1 OUT, INA238 VBUS)
# core: VIN small pads (U1, U2, C11, dividers; the tile path is hand copper), the controller's 12 V / 3V3
# (+3V3* also matches the per-unit +3V3_Cn of tools/netsplit.py)
power_nets = ["+3V3*", "VIN", "CTRL_12V", "CTRL_3V3"]
power_widths = [0.3, 0.4, 0.4, 0.3]
# GND: F / In1 / B pours drawn by tools/route_hand.py (kept group): KRT then skips GND (no GND
# tracks; a plane-tapped GND took 640 stubs and cost signal routes); tools/gndstitch.py ties F / B
# islands to In1 after the copy
planes = { nets = ["VBUS"], layers = ["In2.Cu"], via = [0.6, 0.3] }
ground = { net = "GND", width = 0.4 }

