# pcbkit settings for the PP-48 UNIT board (docs/adr/0005-chained-plane-boards.md).
# 4L JLC 1.6 mm: F parts and pours, In1 GND, In2 VBUS + the SDA/SCL channel, B parts and pours.
#
# 78.5 x 72 mm: 9 mm left margin (chain IN header J301 on B, two M3 holes), slot A (x 100-125), slot B
# (125-150), 19.5 mm input strip (150-169.5: XT60, unit hot-swap, chain OUT header J302 on B, two M3 holes).
# Board flow (tools in ../pp-48/tools): gensch.py unit -> netlist -> mkboard -> outline -> setrules ->
# place_unit.py; routing to follow (rev1 flow: route_hand.py, netsplit.py, krt-route, gndstitch.py).

[project]
name = "pp-48-unit"
libs = { pp48 = "../pp-48/pp48.pretty" }

[mkboard]
copper_layers = 4
stage_x = -120.0
sheet_pitch = 90.0
cell = 14.0
per_row = 6

[outline]
length = 78.5
height = 72.0
origin = [91.0, 100.0]
hole_refs = ["H1", "H2", "H3", "H4"]

[rules]
stackup = "jlc04161h-7628"
layers = { "In1.Cu" = ["power", "GND"], "In2.Cu" = ["mixed", "VBUS"] }

[rules.netclasses]
# name = [track, clearance, via_dia, via_drill]
Default = [0.2, 0.15, 0.5, 0.2]
GND     = [0.4, 0.2, 0.6, 0.3]

[krt]
work = "~/.cache/pcbkit/pp-48-unit/route"
rework = "~/.cache/pcbkit/pp-48-unit/reroute"
clearance = 0.15
via = [0.5, 0.2]
track_width = 0.2
same_net_pad_clearance = 0.15
signal_layers = ["F.Cu", "B.Cu"]
# tools/route_hand.py copper (power pours, shunt vias, Kelvin, In2 channel, taps, core power path,
# CTRL_GND pours and the isolation band)
keep_groups = ["hand"]
# OUT's 7 A path is the hand pours; the router only adds the sense taps (U1 OUT, INA238 VBUS)
# core: VIN small pads (U1, U2, C11, dividers; the tile path is hand copper), the controller's 12 V / 3V3
# (+3V3* also matches the per-unit +3V3_Cn of tools/netsplit.py)
power_nets = ["+3V3*", "VIN", "CTRL_12V", "CTRL_3V3"]
power_widths = [0.3, 0.4, 0.4, 0.3]
# GND: F / In1 / B pours drawn by tools/route_hand.py (kept group): KRT then skips GND (no GND
# tracks; a plane-tapped GND took 640 stubs and cost signal routes); tools/gndstitch.py ties F / B
# islands to In1 after the copy
planes = { nets = ["VBUS"], layers = ["In2.Cu"], via = [0.6, 0.3] }
ground = { net = "GND", width = 0.4 }


[jlcfab]
# KiCad -> EasyEDA rotation / centroid per LCSC part (pcbkit jlc.py convention: rotation delta, then
# dx, dy in mm, KiCad frame at rotation 0, y down; THT from the pad centre). Derived 2026-10-30 by
# fitting each EasyEDA footprint's numbered pads onto ours (method checked against pcbkit's own
# LQFP-48 / SOIC-8 / SOIC-4 entries). Still check the JLC placement preview.
corrections = [
    ["^AMASS_XT60PW-M_1x02_P7.20mm_Horizontal$", "C98732", 270, 0.0, -3.0],
    ["^CP_Elec_10x10$", "C87862", 0, 0.0, 0.0],                     # pad 1 = + on both
    ["^D_SMB$", "C353345", 0, 0.0, 0.0],
    ["^D_SMC$", "C2990209", 0, 0.0, 0.0],
    ["^JST_GH_SM04B-GHS-TB_1x04-1MP_P1.25mm_Horizontal$", "C189895", 0, 0.0, -0.25],
    ["^JST_PH_S14B-PH-K_1x14_P2.00mm_Horizontal$", "C157938", 0, 0.0, 0.0],
    ["^MSOP-10_3x3mm_P0.5mm$", "C111822", 270, 0.0, 0.0],
    ["^PM_Aux_Socket_2x03_P1.27$", "C41397112", 270, 0.0, 0.0],     # symmetric; our pins are numbered by function
    ["^PM_Standoff_M2x7_SMTSO$", "C2916355", 0, 0.0, 0.0],
    ["^SOIC-4_4.55x2.6mm_P1.27mm$", "C55144", 180, 0.0, 0.0],       # TLP291: EasyEDA footprint and model disagree on pin 1, check in the preview
    ["^SOT-23$", "C8545", 180, 0.0, 0.0],
    ["^TDSON-8-1$", "C534364", 270, 0.0, 0.0],                       # fitted on pins 1-4 (EasyEDA numbers the drain pins 5-8, the pad 9)
    ["^TDSON-8-1$", "C534334", 270, 0.0, 0.0],
    ["^TSOT-23-6$", "C2670157", 180, 0.0, 0.0],
    ["^TSSOP-10_3x3mm_P0.5mm$", "C2864837", 270, 0.0, 0.0],
    ["^TerminalBlock_Degson_DG128-5.0-02P$", "C711349", 0, 0.0, 0.0],
    ["^VQFN-32-1EP_5x5mm_P0.5mm_EP3.15x3.15mm$", "C80692", 0, 0.0, 0.0],
    ["^VSSOP-8_2.3x2mm_P0.5mm$", "C70285", 180, 0.0, 0.0],
]
