# pcbkit settings for the PM-19V-250W-B port module (LM5116 single phase).
# 4L JLC, 58.4 x 22.9 mm eighth-brick outline (drawn by tools/place.py).
#
# Board flow (tools/build.sh runs it end to end):
#   gensch -> netlist -> mkboard -> tools/place.py -> setrules ->
#   tools/power.py (pours, via fields, group "power") -> krt-route ->
#   gndpour -> silk -> DRC -> jlcfab

[project]
name = "pm-19v-250w-b"
libs = { pm = "pm.pretty" }

[mkboard]
copper_layers = 4
stage_x = -120.0
sheet_pitch = 90.0
cell = 14.0
per_row = 6

[rules]
stackup = "jlc04161h-7628"
# In1: VIN (input end) and VOUT (output end) pours, signals between;
# In2: solid GND, 0.2 mm under B where the hot loop is.
layers = { "In1.Cu" = ["signal", "SIG"], "In2.Cu" = ["power", "GND"] }

[rules.netclasses]
# name = [track, clearance, via_dia, via_drill]
Default = [0.2, 0.15, 0.5, 0.2]   # 0.15: U1 HTSSOP pads at 0.65 pitch leave 0.19

[krt]
work = "~/.cache/pcbkit/pm-19v-250w-b/route"
rework = "~/.cache/pcbkit/pm-19v-250w-b/reroute"
clearance = 0.2
via = [0.5, 0.2]
track_width = 0.2
same_net_pad_clearance = 0.15
signal_layers = ["F.Cu", "In1.Cu", "B.Cu"]
keep_groups = ["power", "hand"]
power_nets = ["/HG", "/HO", "/LO", "/HB", "/VCC", "/VIN_IC", "/VCCX"]
power_widths = [0.4, 0.4, 0.4, 0.4, 0.4, 0.3, 0.3]
planes = { nets = ["GND"], layers = ["In2.Cu"], via = [0.6, 0.3] }
ground = { net = "GND", width = 0.4 }

[gndpour]
net = "GND"
layers = ["F.Cu", "B.Cu"]
via = [0.6, 0.3]
via_clearance = 0.3
edge_in = 0.8
edge_pitch = 3.0
grid = 3.0
short_edge_inset = 0.0
zone_clearance = 0.25
zone_min_width = 0.25
priority = 1
group = "gnd-stitch"
fill = true

[viaout]
keep = [["U1", "21"]]

[silk]
small_area = 8.0

[jlcfab]
out = "fab"
skip_dnp = true
# KiCad -> EasyEDA rotation / centroid per LCSC part (pcbkit jlc.py convention, see
# power/pp-48-unit/pcbkit.toml). Fitted 2026-10-30 with scratchpad cplfit.py (EasyEDA footprints by
# easyeda2kicad, numbered pads onto ours). Bottom-side parts must stay at dx = dy = 0 (pcbkit jlcfab
# refuses an offset on B). Check every one in JLC's placement preview.
corrections = [
    ["^CP_Elec_6.3x7.7$", "C46550467", 180, 0.0, 0.0],              # F; check the + mark in the preview
    ["^D_SOD-123$", "C2103", 0, 0.0, 0.0],
    ["^D_SOD-323$", "C107713", 0, 0.0, 0.0],
    ["^D_SOD-323$", "C82466", 0, 0.0, 0.0],
    ["^HTSSOP-20-1EP_4.4x6.5mm_P0.65mm_EP3.4x6.5mm_ThermalVias$", "C13755", 270, 0.0, 0.0],
    ["^L_Coilcraft_XAL1510-103$", "C49261402", 0, 0.0, 0.0],
    ["^PM_Aux_Header_2x03_P1.27$", "C41376035", 270, 0.0, 0.0],     # symmetric; our pins are numbered by function
    ["^SOT-23-6$", "C132788", 270, 0.0, 0.0],
    ["^SOT-23-6$", "C623510", 270, 0.0, 0.0],
    ["^SOT-89-3$", "C123402", 180, 0.0, 0.0],                        # B: the fit wants dx -1.47 (tab numbering), not allowed on B; check in the preview
    ["^TDSON-8-1$", "C534364", 270, 0.0, 0.0],                       # fitted on pins 1-4 (as pp-48-unit)
    ["^TDSON-8-1$", "C534398", 270, 0.0, 0.0],
]
