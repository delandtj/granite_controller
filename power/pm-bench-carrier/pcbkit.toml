# pcbkit settings for the PM module bench carrier (overrides the
# granite_controller pcbkit.toml two levels up). 2L JLC, 130 x 55 mm.
#
# Board flow: mkboard -> outline -> setrules -> tools/place.py -> gndpour ->
# tools/power.py (VIN / VOUT trunks, and the GND pours into group "power" so
# krt-route keeps them and skips GND as a plane net: no GND tracks, every GND
# pad lands in the pour) -> krt-route -> gndpour (refill, restitch) -> silk ->
# connlabels -> tools/legend.py.

[project]
name = "pm-bench-carrier"
libs = { carrier = "carrier.pretty" }

[mkboard]
copper_layers = 2
stage_x = -120.0
sheet_pitch = 90.0
cell = 14.0
per_row = 6

[outline]
length = 130.0
height = 55.0
origin = [100.0, 100.0]

[rules]
stackup = ""
layers = {}

[rules.netclasses]
# name = [track, clearance, via_dia, via_drill]
Default = [0.25, 0.2, 0.6, 0.3]

[krt]
work = "~/.cache/pcbkit/pm-bench-carrier/route"
rework = "~/.cache/pcbkit/pm-bench-carrier/reroute"
clearance = 0.2
via = [0.6, 0.3]
track_width = 0.25
same_net_pad_clearance = 0.15
signal_layers = ["F.Cu", "B.Cu"]
keep_groups = ["power", "gnd-stitch"]
# VIN_J / VIN carry ~5.5-7 A (2.5 mm), VOUT 13.2 A (4.0 mm), F.Cu and B.Cu; +5V is the aux rail
# the VIN / VOUT trunks are hand-drawn by tools/power.py (group "power"); KRT only adds the taps
power_nets = ["+5V"]
power_widths = [0.4]

[gndpour]
net = "GND"
layers = ["F.Cu", "B.Cu"]
via = [0.6, 0.3]
via_clearance = 0.3
edge_in = 1.0
edge_pitch = 4.0
grid = 5.0
short_edge_inset = 0.0
zone_clearance = 0.25
zone_min_width = 0.25
priority = 1
group = "gnd-stitch"
fill = true

[silk]
hide_prefixes = ["H", "TP", "SO", "PG", "MOD"]   # TPs carry their net name (tools/legend.py); the mount is drawn by MOD1
order = ["J"]
relax_prefixes = ["J"]

[connlabels]
names = { J1 = "VIN 40-60V", J2 = "VOUT 19V", JP1 = "OFF" }

