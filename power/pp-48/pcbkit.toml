# pcbkit settings for the PP-48 plane (docs/adr/0004-plane-column-layout.md).
# 4L JLC 1.6 mm: F parts and pours, In1 GND, In2 VBUS + the SDA/SCL channel, B parts and pours.
#
# DRAFT (2026-10-28): two columns only (50 x 72 mm), placement for review; the
# core block, the end strip / end cap and all routing come later.
# Board flow: gensch.py N -> netlist -> mkboard -> outline -> setrules -> tools/place.py

[project]
name = "pp-48"
libs = { pp48 = "pp48.pretty" }

[mkboard]
copper_layers = 4
stage_x = -120.0
sheet_pitch = 90.0
cell = 14.0
per_row = 6

[outline]
length = 50.0
height = 72.0
origin = [100.0, 100.0]
hole_refs = []   # holes go in the core block and the end strip (ADR 0004 decision 8), not in the columns

[rules]
stackup = "jlc04161h-7628"
layers = { "In1.Cu" = ["power", "GND"], "In2.Cu" = ["mixed", "VBUS"] }

[rules.netclasses]
# name = [track, clearance, via_dia, via_drill]
Default = [0.2, 0.15, 0.5, 0.2]
GND     = [0.4, 0.2, 0.6, 0.3]

[krt]
work = "~/.cache/pcbkit/pp-48/route"
rework = "~/.cache/pcbkit/pp-48/reroute"
clearance = 0.15
via = [0.5, 0.2]
track_width = 0.2
same_net_pad_clearance = 0.15
signal_layers = ["F.Cu", "B.Cu"]
# tools/route_hand.py copper (power pours, shunt vias, Kelvin, In2 channel, taps)
keep_groups = ["hand"]
# OUT's 7 A path is the hand pours; the router only adds the sense taps (U1 OUT, INA238 VBUS)
power_nets = ["+3V3"]
power_widths = [0.3]
planes = { nets = ["GND", "VBUS"], layers = ["In1.Cu", "In2.Cu"], via = [0.6, 0.3] }
ground = { net = "GND", width = 0.4 }
