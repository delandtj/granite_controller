# pcbkit settings for the PM-19V-250W port module (overrides the
# granite_controller pcbkit.toml one level up). 4L JLC, 58.4 x 22.9 mm
# eighth-brick outline (drawn by tools/place.py, not pcbkit outline).
#
# Board flow: mkboard -> tools/place.py -> setrules -> tools/power.py
# (outer power pours and via fields, group "power") -> krt-route -> gndpour.

[project]
name = "pm-19v-250w"
libs = { pm = "pm.pretty" }

[mkboard]
copper_layers = 4
stage_x = -120.0
sheet_pitch = 90.0
cell = 14.0
per_row = 6

[rules]
stackup = "jlc04161h-7628"
# In1: signals (and the ~2 A VIN feed to phase 2); In2: solid GND, next to
# the bottom MOSFETs so the hot-loop return runs right under them.
layers = { "In1.Cu" = ["signal", "SIG"], "In2.Cu" = ["power", "GND"] }

[rules.netclasses]
# name = [track, clearance, via_dia, via_drill]
Default = [0.2, 0.2, 0.5, 0.2]

[krt]
work = "~/.cache/pcbkit/pm-19v-250w/route"
rework = "~/.cache/pcbkit/pm-19v-250w/reroute"
clearance = 0.2
via = [0.5, 0.2]
track_width = 0.2
same_net_pad_clearance = 0.15
signal_layers = ["F.Cu", "In1.Cu", "B.Cu"]
keep_groups = ["power", "hand"]
# gate drive and bootstrap only: GND, VIN, VOUT and the switch nodes are
# pours and planes (tools/power.py, [krt] planes); what the router adds on
# them is taps and the small-signal feeds (R1, R3, R11), at signal width
power_nets = ["/TG1", "/TG2", "/BG1", "/BG2", "/BOOST1", "/BOOST2", "/DRVCC"]
# 0.3: widest track that leaves U1's 0.3 mm pads at 0.5 mm pitch with 0.2
# clearance (KRT only necks down plane taps, not pad escapes)
power_widths = [0.3, 0.3, 0.3, 0.3, 0.3, 0.3, 0.3]
planes = { nets = ["GND"], layers = ["In2.Cu"], via = [0.6, 0.3] }
ground = { net = "GND", width = 0.5 }

[gndpour]
net = "GND"
layers = ["F.Cu", "B.Cu"]
via = [0.6, 0.3]
via_clearance = 0.3
edge_in = 0.8
edge_pitch = 3.0
grid = 3.0
short_edge_inset = 0.0
zone_clearance = 0.25
zone_min_width = 0.25
priority = 1
group = "gnd-stitch"
fill = true

[jlcfab]
out = "fab"
skip_dnp = true
# KiCad -> EasyEDA rotation / centroid per LCSC part (pcbkit jlc.py convention, see
# power/pp-48-unit/pcbkit.toml). Fitted 2026-11-05 (EasyEDA footprints by easyeda2kicad, numbered
# pads onto ours); parts shared with PM-19V-250W-B copied from its table. Check them in JLC's preview.
corrections = [
    ["^CP_EIA-7360-38_Kemet-E$", "C2158991", 180, 0.0, 0.0],         # C24 / C25: EasyEDA pad 1 = + as the Kemet-D entry; check the + mark in the preview
    ["^D_SOD-323$", "C107713", 0, 0.0, 0.0],                         # from B
    ["^D_SOD-323$", "C82466", 0, 0.0, 0.0],                          # from B
    ["^L_Coilcraft_XAL1510-223$", "C49261404", 0, 0.0, 0.0],         # no EasyEDA data; same package as B's XAL1510-103 C49261402 (0), two pads
    ["^LQFP-48-1EP_7x7mm_P0.5mm_EP3.6x3.6mm$", "C581067", 270, 0.0, 0.0],  # LTC7810 U1: fitted, all pads within 0.08 mm
    ["^PM_Aux_Header_2x03_P1.27$", "C41376035", 270, 0.0, 0.0],      # from B; symmetric, our pins are numbered by function
    ["^SOT-23-6$", "C623510", 270, 0.0, 0.0],                        # MCP65R46, from B
    ["^TDSON-8-1$", "C534364", 270, 0.0, 0.0],                       # from B (fitted on pins 1-4)
]
